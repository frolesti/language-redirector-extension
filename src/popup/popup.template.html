<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="{{LANG_CODE}}">

  <!-- Header with title -->
  <div class="popup-header">
    <h3 class="popup-title" aria-label="{{POPUP_TITLE}}">
      <span class="popup-title-text">{{POPUP_TITLE}}</span>
      <span class="popup-title-brand" aria-hidden="true">
        <span class="brand-char">M</span>
        <span class="brand-o">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="1" y="4" width="22" height="16" rx="8" ry="8" fill="currentColor" />
            <rect x="2.4" y="5.4" width="19.2" height="13.2" rx="6.6" ry="6.6" fill="#422C80" />
            <circle cx="15.8" cy="12" r="4.1" fill="currentColor" />
          </svg>
        </span>
        <span class="brand-char">STRA</span>
      </span>
    </h3>
  </div>

  <div class="container">

    <!-- Browser language warning -->
    <div id="browserWarningContainer" style="display: none;">
      <div id="browserWarningContent" class="lang-warning-full">
        <button id="closeBrowserWarning" class="lang-warning-close" title="Minimitzar">&times;</button>
        <div class="warning-headline">
          <span class="warning-icon warning-icon--alert" aria-hidden="true">⚠️</span>
          <div class="warning-body">
            <div id="browserWarningText" class="warning-title">{{BROWSER_LANG_WARN}}</div>
            <div class="warning-meta" id="browserDetectedLang"></div>
            <a id="browserMoreInfoLink" class="warning-more-link" href="https://configura.cat/aplicacions" target="_blank" rel="noopener">Consulta les instruccions per corregir-ho</a>
          </div>
        </div>
        <div class="warning-actions">
          <a class="icon-btn" href="https://configura.cat/aplicacions" target="_blank" rel="noopener" title="Veure-ho a configura.cat" aria-label="Veure informació a configura.cat">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </a>
          <a id="langFixBrowserLink" class="icon-btn" href="#" title="Obre la configuració del navegador" aria-label="Obre la configuració d'idioma del navegador">
            {{BROWSER_ICON_SVG}}
          </a>
        </div>
      </div>
      <div id="browserWarningMinimized" class="lang-warning-minimized" title="Mostrar avís de llengua">⚠️</div>
    </div>

    <!-- Account language info (Chrome/Firefox) -->
    <div id="googleWarningContainer" style="display: none;">
      <div id="googleWarningContent" class="lang-warning-full lang-warning-full--info">
        <button id="closeGoogleWarning" class="lang-warning-close" title="Minimitzar">&times;</button>
        <div class="warning-headline">
          <span class="warning-icon warning-icon--info" aria-hidden="true">ℹ️</span>
          <div class="warning-body">
            <div id="googleWarningText" class="warning-title">{{GOOGLE_LANG_WARN}}</div>
          </div>
        </div>
        <div class="warning-actions">
          <a class="icon-btn" href="https://configura.cat/google" target="_blank" rel="noopener" title="Veure-ho a configura.cat" aria-label="Veure informació a configura.cat">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </a>
          <a id="langFixAccountLink" class="icon-btn" href="#" title="Obre la configuració del compte" aria-label="Obre la configuració d'idioma del compte">
            {{ACCOUNT_ICON_SVG}}
          </a>
        </div>
      </div>
      <div id="googleWarningMinimized" class="lang-warning-minimized" title="Mostrar avís de llengua">ℹ️</div>
    </div>

    <p class="popup-desc">{{POPUP_TEXT}}</p>

    <!-- Toggle -->
    <div class="toggle-row">
      <label class="switch" style="margin-bottom:0;">
        <input type="checkbox" id="toggleExtension">
        <span class="slider round"></span>
      </label>
      <span id="toggleLabel">{{ENABLE_TEXT}}</span>
    </div>

    <!-- Exclusion Checkbox -->
    <div class="exclude-section">
      <label>
        <input type="checkbox" id="excludeDomain">
        <span style="user-select: none;">{{EXCLUDE_TEXT}}</span>
      </label>
      <div id="domainName" class="domain-name"></div>
    </div>

    <!-- Action Buttons -->
    <button id="donate">{{DONATE_TEXT}}</button>

    <!-- Exclusions Manager -->
    <div class="exclusions-manager">
      <details>
        <summary>{{MANAGE_EXCLUSIONS_TEXT}}</summary>
        <ul id="excludedList">
          <!-- populated by js -->
        </ul>
      </details>
    </div>
    <button id="report">{{REPORT_TEXT}}</button>

    <p id="status" style="display:none;"></p>
  </div>

  <!-- Footer credit -->
  <div class="popup-footer">
    <div class="legacy-credit" id="legacyCredit">{{LEGACY_NAME_TEXT}}</div>
    <div class="footer-separator" aria-hidden="true"></div>
    <div class="creator-credit">
      {{CREATOR_TEXT}}
      <a href="{{CREATOR_URL}}" target="_blank" rel="noopener" class="creator-link">{{CREATOR_NAME}}</a>
    </div>
    <a href="https://configura.cat" target="_blank" rel="noopener" class="configura-link" aria-label="Configura.cat">
      <img src="../../icons/configura_on.png" alt="configura.cat">
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
