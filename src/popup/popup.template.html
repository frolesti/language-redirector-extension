<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="{{LANG_CODE}}">

  <!-- Header with title -->
  <div class="popup-header">
    <h3>{{POPUP_TITLE}}</h3>
  </div>

  <div class="container">

    <!-- Browser Language Warning -->
    <div id="langWarningContainer" style="display: none;">
      <!-- Full Warning -->
      <div id="langWarningContent" class="lang-warning-full">
        <button id="closeLangWarning" class="lang-warning-close" title="Minimitzar">&times;</button>
        <div id="langWarningText">{{BROWSER_LANG_WARN}}</div>
        <div class="lang-warning-scopes">
          <div class="lang-scope-row" data-scope="browser">
            <span class="lang-scope-label">
              <strong class="lang-scope-title">Navegador:</strong>
              <span id="langBrowserDetected" class="lang-scope-value">—</span>
            </span>
          </div>
          <div class="lang-scope-row" data-scope="account">
            <span class="lang-scope-label">
              <strong class="lang-scope-title">Compte Google:</strong>
              <span id="langAccountDetected" class="lang-scope-value">no detectat</span>
            </span>
          </div>
        </div>
        <div class="lang-warning-actions">
          <a id="langMoreInfoLink" href="#">{{BROWSER_LANG_MORE_INFO}}</a>
          <a id="langFixBrowserLink" href="#">{{BROWSER_LANG_SOLUTION_BROWSER}}</a>
          <a id="langFixAccountLink" href="#">{{BROWSER_LANG_SOLUTION_ACCOUNT}}</a>
        </div>
      </div>
      <!-- Minimized Warning -->
      <div id="langWarningMinimized" class="lang-warning-minimized" title="Mostrar avís de llengua">⚠️</div>
    </div>

    <p class="popup-desc">{{POPUP_TEXT}}</p>

    <!-- Toggle -->
    <div class="toggle-row">
      <label class="switch" style="margin-bottom:0;">
        <input type="checkbox" id="toggleExtension">
        <span class="slider round"></span>
      </label>
      <span id="toggleLabel">{{ENABLE_TEXT}}</span>
    </div>

    <!-- Exclusion Checkbox -->
    <div class="exclude-section">
      <label>
        <input type="checkbox" id="excludeDomain">
        <span style="user-select: none;">{{EXCLUDE_TEXT}}</span>
      </label>
      <div id="domainName" class="domain-name"></div>
    </div>

    <!-- Action Buttons -->
    <button id="donate">{{DONATE_TEXT}}</button>
    <button id="report">{{REPORT_TEXT}}</button>

    <!-- Exclusions Manager -->
    <div class="exclusions-manager">
      <details>
        <summary>{{MANAGE_EXCLUSIONS_TEXT}}</summary>
        <ul id="excludedList">
          <!-- populated by js -->
        </ul>
      </details>
    </div>

    <p id="status" style="display:none;"></p>
  </div>

  <!-- Footer credit -->
  <div class="popup-footer">
    <a href="https://configura.cat" target="_blank" class="configura-link">
      <img src="../../icons/configura_on.png" alt="configura.cat">
    </a>
    <div class="legacy-credit" id="legacyCredit">{{LEGACY_NAME_TEXT}}</div>
    <div class="creator-credit">
      {{CREATOR_TEXT}}
      <a href="{{CREATOR_URL}}" target="_blank" rel="noopener" class="creator-link">{{CREATOR_NAME}}</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
